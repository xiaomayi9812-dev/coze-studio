id: 69013
name: Cursor-GPT-5.6-Proxy
description:
    zh: 本机 Cursor 代理 GPT-5.6 / Codex 线（Phase 1，无 Function Call）
    en: Local Cursor proxy for GPT-5.6 (Phase 1, no function call)
meta:
    protocol: openai
    conn_config:
        # Docker coze-server 访问宿主机代理；本机 make server 请改成 127.0.0.1
        base_url: "http://host.docker.internal:8787/v1"
        api_key: "local-proxy"
        timeout: 180s
        model: "gpt-5.6-sol-high"
        temperature: 0.7
        max_tokens: 4096
